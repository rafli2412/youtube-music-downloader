[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-music-downloader"
version = "0.1.0"
description = "A terminal-first YouTube audio downloader with a React desktop companion."
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = ["yt-dlp[default]==2026.10.26", "mutagen==1.48.1"]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]
build = ["pyinstaller==6.22.3"]
dev = ["ruff==0.14.4"]

[project.scripts]
ytmp3 = "ytmp3.cli:main"

[project.gui-scripts]
ytmp3-desktop = "ytmp3.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

